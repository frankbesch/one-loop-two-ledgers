name: CI
# Offline checks only: no model calls, no keys, no spend.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit check reads bill lines with pdftotext -bbox-layout.
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Unit check, every cell against the key
        run: python3 -B jobb/units.py --corpus synth-jobb --check

      - name: Gate tests, scored corpus
        working-directory: synth-jobb
        run: python3 -B -m unittest test_b

      - name: Gate tests, smoke corpus
        working-directory: synth-jobb-smoke
        run: python3 -B -m unittest test_b

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          V: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          tgz="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tgz}"
          curl -sSfL "${base}/gitleaks_${V}_checksums.txt" -o sums.txt
          grep " ${tgz}\$" sums.txt | sha256sum -c -
          tar -xzf "${tgz}" gitleaks

      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
