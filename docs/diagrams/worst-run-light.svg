<svg viewBox="0 0 360 549" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Silent errors, worst run</title>
<desc>Silent errors, the planted errors posted with no person looking, in each design&#x27;s worst run. Oil and gas bills, months 3 to 6, 840 lines: the loop 0 (worst of 3 runs), one agent 2 (worst of 3), confidence handoff 28 (1 run), sampled audit 87 (seeded run). Bank certificates, two scored quarters, 198 units: the loop 1 (worst of 3), one agent 0 (worst of 3), confidence handoff 2 (1 run), sampled audit 23 (seeded run).</desc>
