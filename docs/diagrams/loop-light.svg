<svg viewBox="0 0 360 549" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>The typed-question loop</title>
<desc>The typed-question loop. The text of a partner bill or a compliance certificate comes in. Code reads the printed numbers and looks up the reference documents. Where a judgment is needed, a model answers one narrow question from a closed list that always includes needs review. Code checks the answer and its quote against the page and holds anything below a frozen confidence floor. Each line is posted, or held for a named owner.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="549" rx="6" fill="#FBFBFE"/>
<text x="16" y="30" font-size="15" fill="#22232E" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>The typed-question loop</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D0D2E6"/>
<rect x="16" y="56" width="328" height="70" rx="5" fill="#E4E5F3" stroke="#5C5F78" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#22232E" text-anchor="middle" font-weight="600">Page text in</text>
<text x="180" y="97" font-size="12" fill="#5C5F78" text-anchor="middle">a partner bill or a loan compliance</text>
<text x="180" y="113" font-size="12" fill="#5C5F78" text-anchor="middle">certificate</text>
<path d="M180 128 L180 159" fill="none" stroke="#5C5F78" stroke-width="1.5"/><polygon points="175,151 185,151 180,159" fill="#5C5F78"/>
<rect x="16" y="163" width="328" height="70" rx="5" fill="#E4E5F3" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="186" font-size="12.5" fill="#22232E" text-anchor="middle" font-weight="600">Code reads the page</text>
<text x="180" y="204" font-size="12" fill="#5C5F78" text-anchor="middle">printed numbers, reference lookups,</text>
<text x="180" y="220" font-size="12" fill="#5C5F78" text-anchor="middle">arithmetic</text>
<path d="M180 235 L180 266" fill="none" stroke="#5C5F78" stroke-width="1.5"/><polygon points="175,258 185,258 180,266" fill="#5C5F78"/>
<rect x="16" y="270" width="328" height="54" rx="5" fill="#E4E5F3" stroke="#0084A9" stroke-width="1.5"/>
<text x="180" y="293" font-size="12.5" fill="#22232E" text-anchor="middle" font-weight="600">Model answers one typed question</text>
<text x="180" y="311" font-size="12" fill="#5C5F78" text-anchor="middle">closed list, always with needs review</text>
<path d="M180 326 L180 357" fill="none" stroke="#5C5F78" stroke-width="1.5"/><polygon points="175,349 185,349 180,357" fill="#5C5F78"/>
<rect x="16" y="361" width="328" height="54" rx="5" fill="#E4E5F3" stroke="#90302B" stroke-width="1.5"/>
<text x="180" y="384" font-size="12.5" fill="#22232E" text-anchor="middle" font-weight="600">Code checks answer and quote</text>
<text x="180" y="402" font-size="12" fill="#5C5F78" text-anchor="middle">below the frozen floor: hold</text>
<path d="M180 417 L180 448" fill="none" stroke="#5C5F78" stroke-width="1.5"/><polygon points="175,440 185,440 180,448" fill="#5C5F78"/>
<rect x="16" y="452" width="328" height="54" rx="5" fill="#E4E5F3" stroke="#23749E" stroke-width="1.5"/>
<text x="180" y="475" font-size="12.5" fill="#22232E" text-anchor="middle" font-weight="600">Post, or hold for a named owner</text>
<text x="180" y="493" font-size="12" fill="#5C5F78" text-anchor="middle">a held line goes to a person</text>
<text x="16" y="532" font-size="12" fill="#5C5F78" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Floors are frozen with SHA-256 before scoring.</text>
</svg>
